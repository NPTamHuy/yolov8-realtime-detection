{% extends 'base.html' %}

{% block content %}
<div class="text-center">
    <div class="card shadow-sm p-4 mb-4 bg-dark border-secondary">
        <h4 class="mb-3 text-light">Phân tích luồng Camera trực tiếp</h4>
        <div class="mb-3">
            <button id="toggleCameraBtn" class="btn btn-success me-2 fw-bold">▶ Bật Camera</button>
            <button id="switchBtn" class="btn btn-outline-light">🔄 Đổi Camera Trước/Sau</button>

            <!-- Checkbox Tiền xử lý (Bộ lọc OpenCV) -->
            <div class="form-check form-switch d-inline-block ms-3 text-light">
                <input class="form-check-input" type="checkbox" id="preprocessSwitch">
                <label class="form-check-label" for="preprocessSwitch">Bật bộ lọc (OpenCV)</label>
            </div>
        </div>

        <!-- Khung hiển thị Camera -->
        <div class="stream-container shadow-lg">
            <video id="video" autoplay playsinline style="display:none;"></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <img id="result" alt="Camera đang tắt. Vui lòng nhấn Bật Camera.">
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const resultImg = document.getElementById('result');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const switchBtn = document.getElementById('switchBtn');
    const preprocessSwitch = document.getElementById('preprocessSwitch');

    let useFrontCamera = false;
    let streaming = false;
    let streamRef = null;

    // Hàm Bật/Tắt Camera
    async function toggleCamera() {
        if (streaming) {
            // Tắt camera
            streamRef.getTracks().forEach(track => track.stop());
            streaming = false;
            toggleCameraBtn.innerHTML = "▶ Bật Camera";
            toggleCameraBtn.classList.replace('btn-danger', 'btn-success');
            resultImg.src = "";
            resultImg.alt = "Camera đã tắt.";
        } else {
            // Bật camera
            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? "user" : "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };
                streamRef = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = streamRef;
                await video.play();
                streaming = true;

                toggleCameraBtn.innerHTML = "⏹ Tắt Camera";
                toggleCameraBtn.classList.replace('btn-success', 'btn-danger');

                // Bắt đầu gửi frame lên server
                sendFrames();
            } catch (err) {
                alert("Không thể truy cập camera. Vui lòng cấp quyền hoặc đảm bảo đang chạy trên localhost/HTTPS!");
                console.error(err);
            }
        }
    }

    // Sự kiện Đổi Camera
    switchBtn.addEventListener('click', () => {
        if (streaming) {
            toggleCamera(); // Tắt camera hiện tại
            // Đợi một chút để hệ thống giải phóng camera cũ rồi bật lại với mode mới
            setTimeout(() => {
                useFrontCamera = !useFrontCamera;
                toggleCamera();
            }, 500);
        } else {
            useFrontCamera = !useFrontCamera;
        }
    });

    toggleCameraBtn.addEventListener('click', toggleCamera);

    // Hàm chụp ảnh từ video và gửi lên server liên tục
    function sendFrames() {
        if (!streaming) return;

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append('image', blob, 'frame.jpg');

            // Gửi kèm trạng thái checkbox tiền xử lý
            formData.append('use_filter', preprocessSwitch.checked);

            fetch('/detect', {
                method: 'POST',
                body: formData
            })
            .then(response => response.blob())
            .then(blob => {
                // Hiển thị ảnh đã vẽ bounding box trả về từ server
                resultImg.src = URL.createObjectURL(blob);

                // Gọi đệ quy để tiếp tục gửi frame tiếp theo (Cơ chế chống nghẽn)
                if(streaming) requestAnimationFrame(sendFrames);
            })
            .catch(err => {
                console.error("Lỗi gửi frame:", err);
                // Nếu lỗi mạng tạm thời, chờ 0.5s rồi thử lại
                if(streaming) setTimeout(sendFrames, 500);
            });
        }, 'image/jpeg', 0.6); // Nén JPEG mức 60% để truyền tải nhanh, giảm trễ
    }
</script>
{% endblock %}
