<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YOLOv8 Mobile Camera</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #222; color: #fff; margin: 0; padding: 10px; }
        h1 { font-size: 18px; margin: 10px 0; }
        #container { position: relative; display: inline-block; max-width: 100%; }
        img, video { width: 100%; max-width: 480px; border: 3px solid #4CAF50; border-radius: 8px; display: block; margin: 0 auto; }
        video { display: none; } /* Ẩn thẻ video gốc, chỉ hiển thị kết quả trả về từ YOLO */
        button { padding: 10px 20px; font-size: 15px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🎥 Nhận diện vật cản YOLOv8 (Camera Sau)</h1>
    <button id="switchBtn">🔄 Đổi Camera</button>
    <br>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div>
        <img id="result" alt="Đang chờ kết nối camera...">
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const resultImg = document.getElementById('result');

        let useFrontCamera = false; // Mặc định dùng camera sau (environment)
        let streaming = false;

        async function startCamera() {
            if (streaming) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? "user" : "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
                streaming = true;
                sendFrames();
            } catch (err) {
                console.error("Lỗi camera: ", err);
                alert("Không thể truy cập camera điện thoại. Hãy chắc chắn bạn đã cấp quyền!");
            }
        }

        document.getElementById('switchBtn').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Gửi khung hình liên tục lên Flask server để xử lý
        function sendFrames() {
            if (!streaming) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('image', blob, 'frame.jpg');

                fetch('/detect', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.blob())
                .then(blob => {
                    resultImg.src = URL.createObjectURL(blob);
                    // Tiếp tục gửi khung hình tiếp theo sau khi nhận kết quả để chống lag
                    requestAnimationFrame(sendFrames);
                })
                .catch(err => {
                    console.error(err);
                    setTimeout(sendFrames, 500);
                });
            }, 'image/jpeg', 0.6); // Độ nén JPEG 60% giúp truyền tải qua Wi-Fi cực nhanh, không bị nghẽn
        }

        startCamera();
    </script>
</body>
</html>
